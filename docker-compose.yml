services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: rag_postgres

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${RAG_DB_USER}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD}
      POSTGRES_DB: ${RAG_DB_NAME}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - rag_pgdata:/var/lib/postgresql/data

volumes:
  rag_pgdata: