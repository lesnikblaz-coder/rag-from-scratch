services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:10000"
    env_file:
      - .env
    environment:
      PORT: "10000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: rag_postgres

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${RAG_DB_USER}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD}
      POSTGRES_DB: ${RAG_DB_NAME}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - rag_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  rag_pgdata: